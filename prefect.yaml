# Generic metadata about this project
name: github-deploy-yml
prefect-version: 3.2.2

# build section allows you to manage and build docker images
build: null

# push section allows you to manage if and how this project is uploaded to remote locations
push: null

# pull section allows you to provide instructions for cloning this project in remote locations
pull:
- prefect.deployments.steps.git_clone:
    repository: 'https://github.com/Rohan-S-29/prefect-app'
    branch: 'main'
    access_token: "{{ prefect.blocks.secret.github-token }}"

# the deployments section allows you to provide configuration for deploying flows
deployments:
- name: github-bankapp
  version: 1.0
  tags: []
  description: "bank application deployed through github"
  schedule: 
    cron: "*/5 * * * *"
    timezone: "Asia/Kolkata"
    active: true
  flow_name: bankflow
  entrypoint: bankapp.py:bankflow
  parameters: {}
  work_pool:
    name: workpool-basic
    work_queue_name: default
    job_variables: {}
